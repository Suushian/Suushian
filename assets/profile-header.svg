<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sushian — Ideas, Code, Innovation</title>
  <desc id="desc">A midnight-blue animated banner with gently drifting blue light, orbiting accents, and the name Sushian.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D18"/><stop offset=".55" stop-color="#101F38"/><stop offset="1" stop-color="#07111F"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7DD3FC"/><stop offset=".48" stop-color="#3B82F6"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2563EB" stop-opacity=".42"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#93C5FD" stroke-opacity=".07" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <ellipse cx="950" cy="115" rx="300" ry="220" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity" values=".65;1;.65" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="910;990;910" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="1000" cy="180" r="112" fill="none" stroke="#60A5FA" stroke-opacity=".12">
    <animate attributeName="r" values="106;116;106" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".08;.22;.08" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="180" r="82" fill="none" stroke="#60A5FA" stroke-opacity=".18">
    <animate attributeName="r" values="78;86;78" dur="6s" repeatCount="indefinite"/>
  </circle>
  <path d="M890 180c0-62 49-106 110-106s110 44 110 106-49 106-110 106" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".7" stroke-dasharray="18 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-128" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M965 142h22v76h-22zM1013 142h22v76h-22z" rx="11" fill="url(#accent)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="1110" cy="88" r="4" fill="#7DD3FC"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="875" cy="260" r="3" fill="#60A5FA"><animate attributeName="opacity" values="1;.25;1" dur="4.5s" repeatCount="indefinite"/></circle>
  <path d="M72 76h46" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <text x="72" y="170" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="5">SUSHIAN</text>
  <text x="76" y="220" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="5">IDEAS  /  CODE  /  INNOVATION</text>
  <text x="76" y="274" fill="#A8B6CC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Independent builder · AI-assisted development · Continuous evolution</text>
  <rect x="72" y="310" width="54" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="54;76;54" dur="5s" repeatCount="indefinite"/></rect>
  <rect x="136" y="310" width="22" height="4" rx="2" fill="#3B82F6" opacity=".45"/>
</svg>